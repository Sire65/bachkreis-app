# Veröffentlicht die App kostenlos auf GitHub Pages – nur bei grünen Tests auf main (Zweig gh-pages).
# Repository-Variablen (Settings › Secrets and variables › Actions › Variables), keine Geheimnisse:
#   BK_DATENQUELLE = supabase              → Echtbetrieb unter /, Vorführversion zusätzlich unter /demo/
#   BK_API_URL     = https://<ref>.supabase.co/functions/v1/bk-api
# Ohne Variablen bleibt es bei der Vorführversion unter /.
name: Pages
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  veroeffentlichen:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BK_DATENQUELLE: ${{ vars.BK_DATENQUELLE }}
      BK_API_URL: ${{ vars.BK_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Seite zusammenstellen
        run: |
          WEB="index.html verwaltung.html manifest.webmanifest sw.js version.json css js lib icons"
          mkdir _site
          if [ "$BK_DATENQUELLE" = "supabase" ] && [ -n "$BK_API_URL" ]; then
            cp -r $WEB _site/
            mkdir _site/demo && cp -r $WEB _site/demo/
            printf 'export const UMGEBUNG = { datenquelle: "supabase", apiUrl: "%s" };\n' "$BK_API_URL" > _site/js/kern/umgebung.js
            HERKUNFT=$(echo "$BK_API_URL" | sed -E 's#^(https://[^/]+).*#\1#')
            sed -i "s#connect-src 'self';#connect-src 'self' $HERKUNFT;#" _site/index.html _site/verwaltung.html
            echo "Echtbetrieb: $HERKUNFT · Vorführversion unter /demo/"
          else
            cp -r $WEB _site/
            echo "Vorführversion"
          fi
          touch _site/.nojekyll
      - name: Nach gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Veröffentlichung $(jq -r .version version.json) aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
