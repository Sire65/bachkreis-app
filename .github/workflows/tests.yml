name: Tests
on:
  push:
  pull_request:
jobs:
  vertrag-logik-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  browser:
    runs-on: ubuntu-24.04 # Playwright 1.56 kann auf ubuntu-latest (26.04) keinen Chromium installieren – sonst wird Pages übersprungen
    needs: vertrag-logik-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm i --no-save playwright@1.56.1 @axe-core/playwright@4.14.0 && npx playwright install --with-deps chromium
      - name: Rundgang Vorführversion (alle Rollen, alle Kacheln)
        run: |
          python3 -m http.server 8080 &
          sleep 1
          BASIS=http://localhost:8080 node tests/e2e/rundgang.mjs
      - name: Echtbetrieb (Server-Logik + PostgreSQL, Anmeldung, Datenschutz, Abgleich)
        run: node tests/e2e/echtbetrieb.mjs
      - name: Barrierefreiheit (axe, WCAG 2.1 AA – jede Ansicht, jede Rolle; ♿ 0.60.0 muss bei 0 bleiben)
        run: |
          curl -s -o /dev/null http://localhost:8080/ || (python3 -m http.server 8080 &)
          sleep 1
          BASIS=http://localhost:8080 node tests/e2e/barrierefrei.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rundgang-bilder
          path: tests/e2e/bilder/
