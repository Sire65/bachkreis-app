# Veröffentlicht die Vorführversion kostenlos auf GitHub Pages – nur bei grünen Tests auf main.
# Weg über den Zweig gh-pages (Pages-Quelle „Deploy from a branch“), damit keine Sondereinstellung nötig ist.
name: Pages
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  veroeffentlichen:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Nur Web-Dateien nach gh-pages
        run: |
          mkdir _site
          cp -r index.html verwaltung.html manifest.webmanifest sw.js version.json css js lib icons _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Veröffentlichung $(jq -r .version version.json) aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
