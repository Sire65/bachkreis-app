name: Tests
on:
  push:
  pull_request:
jobs:
  vertrag-und-logik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  rundgang:
    runs-on: ubuntu-latest
    needs: vertrag-und-logik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 &
          sleep 1
          BASIS=http://localhost:8080 node tests/e2e/rundgang.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rundgang-bilder
          path: tests/e2e/bilder/
