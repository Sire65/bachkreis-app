# 💤 0.36.0 Supabase wach halten: kostenlose Projekte schlafen nach 7 Tagen ohne Nutzung ein (z. B. in den Sommerferien).
# Einmal pro Woche ein kleiner Aufruf an bk-api ({"aktion":"wach"} – eine Mini-Abfrage, gibt nichts preis).
# Läuft nur, wenn das Secret SUPABASE_PROJECT_REF eingetragen ist (also im Echtbetrieb). Hinweis: GitHub pausiert geplante Abläufe
# nach 60 Tagen ohne Änderung am Repository – dann unter Actions › „Supabase wach halten“ einmal „Enable workflow“ drücken.
name: Supabase wach halten
on:
  schedule:
    - cron: "17 6 * * 1,4"   # montags und donnerstags 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wach:
    runs-on: ubuntu-24.04
    steps:
      - name: bk-api anrufen
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ]; then echo "Noch kein Supabase-Projekt eingetragen – nichts zu tun."; exit 0; fi
          antwort=$(curl -sS --max-time 30 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/bk-api" -H "Content-Type: application/json" -d '{"aktion":"wach"}')
          echo "$antwort"
          echo "$antwort" | grep -q '"ok":true'
