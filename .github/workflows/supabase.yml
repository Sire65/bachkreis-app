# Richtet das Bachkreis-Supabase-Projekt ein bzw. aktualisiert es: Datenbank-Migrationen, Edge Functions bk-api und
# bk-kom (BK Communicator), Push-Schlüssel (VAPID, einmalig erzeugt) und die minütliche Wartung (pg_cron).
# Benötigte Repository-Secrets (Settings › Secrets and variables › Actions › Secrets):
#   SUPABASE_ACCESS_TOKEN  – persönlicher Zugangs-Token des Bachkreis-Supabase-Kontos
#   SUPABASE_PROJECT_REF   – Projekt-Kennung (z. B. abcdefghijklmnopqrst)
#   SUPABASE_DB_PASSWORD   – Datenbank-Passwort des Projekts
# Ohne Secrets wird der Lauf übersprungen (die Vorführversion braucht keinen Server).
name: Supabase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**"]
concurrency:
  group: supabase
  cancel-in-progress: false
jobs:
  einrichten:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Secrets vorhanden?
        id: pruefen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::notice::Supabase-Secrets fehlen – Einrichtung übersprungen (siehe docs/ECHTBETRIEB.md)."
            echo "los=nein" >> "$GITHUB_OUTPUT"
          else echo "los=ja" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pruefen.outputs.los == 'ja'
      - uses: supabase/setup-cli@v1
        if: steps.pruefen.outputs.los == 'ja'
        with:
          version: latest
      - name: Datenbank-Migrationen einspielen
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
      - name: Secrets des BK Communicators (VAPID einmalig, Wartungs-Schlüssel je Lauf neu)
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          APP_URL="https://$OWNER.github.io/${{ github.event.repository.name }}/"
          VORHANDEN=$(supabase secrets list --project-ref "$PROJECT_REF" 2>/dev/null || true)
          if ! echo "$VORHANDEN" | grep -q "BK_VAPID_PRIVATE"; then
            npx --yes web-push@3.6.7 generate-vapid-keys --json > /tmp/vapid.json
            PUB=$(node -e "console.log(require('/tmp/vapid.json').publicKey)")
            PRIV=$(node -e "console.log(require('/tmp/vapid.json').privateKey)")
            echo "::add-mask::$PRIV"
            supabase secrets set --project-ref "$PROJECT_REF" BK_VAPID_PUBLIC="$PUB" BK_VAPID_PRIVATE="$PRIV" BK_VAPID_SUBJECT="$APP_URL" >/dev/null
            rm -f /tmp/vapid.json
            echo "::notice::Push-Schlüssel (VAPID) erzeugt."
          fi
          if ! echo "$VORHANDEN" | grep -q "BK_KALENDER_GEHEIMNIS"; then
            KAL=$(openssl rand -hex 32); echo "::add-mask::$KAL"
            supabase secrets set --project-ref "$PROJECT_REF" BK_KALENDER_GEHEIMNIS="$KAL" >/dev/null
            echo "::notice::Schlüssel für das Kalender-Abo erzeugt (einmalig – sonst würden alle Abo-Links ungültig)."
          fi
          KOM_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$KOM_TOKEN"
          echo "KOM_TOKEN=$KOM_TOKEN" >> "$GITHUB_ENV"
          supabase secrets set --project-ref "$PROJECT_REF" BK_KOM_TOKEN="$KOM_TOKEN" BK_APP_URL="$APP_URL" BK_ERLAUBTE_URSPRUENGE="https://$OWNER.github.io" >/dev/null
      - name: Edge Functions bk-api und bk-kom veröffentlichen
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          supabase functions deploy bk-api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy bk-kom --project-ref "$PROJECT_REF" --no-verify-jwt
          echo "::notice::bk-api: https://$PROJECT_REF.supabase.co/functions/v1/bk-api – als Variable BK_API_URL eintragen."
      - name: Communicator-Wartung einrichten (Vault + pg_cron, jede Minute)
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          for i in 1 2 3 4 5 6; do
            R=$(curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/bk-kom" -H "Content-Type: application/json" -H "x-bk-planer: $KOM_TOKEN" -d '{"aufgabe":"einrichten"}' || true)
            if echo "$R" | grep -q '"ok":true'; then echo "Einrichtung: $R"; exit 0; fi
            echo "Versuch $i: $R – warte auf neue Secrets …"; sleep 10
          done
          echo "::warning::Communicator-Wartung konnte nicht eingerichtet werden (siehe docs/KOMMUNIKATION.md)."
